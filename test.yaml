---
- name: "DCNM Ansible Modules Saving Carpal Tunnel Since 2019"
  hosts: localhost
  gather_facts: false
  tasks:
      - name: "defaulting interfaces"
        dcnm_default_interface:
          base_url: https://dcnm-lab.dev.schwab.com
          username: "{{ ansible_user }}"
          password: "{{ ansible_password }}"
          fabric_name: "PDC1-LAB-Fabric"
          switches:
            rlf04lab:
              - Ethernet1/1
              - Ethernet1/2
            rlf05lab:
              - Ethernet1/1
              - Ethernet1/2
        register: results
        
      - name: Debug results
        debug:
          var: stderr_lines
